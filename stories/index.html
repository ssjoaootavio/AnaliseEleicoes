<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stories Eleições 2026</title>
<meta name="description" content="Resumo em 6 stories da mudança entre o 1º e o 2º turno de 2026, com dados oficiais do TSE.">
<style>
:root{--bg:#0f1214;--ink:#eceff1;--muted:#8c949c;--line:#2b3136;--seg:#3a4148;--font:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:12px 16px;gap:12px;overflow:hidden}
.stage{position:relative;height:min(calc(100dvh - 88px),calc((100vw - 32px) * 16 / 9));aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .2s}
.stage img.on{opacity:1}
.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:5px;z-index:2}
.bars span{flex:1;height:3px;border-radius:2px;background:var(--seg)}
.bars span.done{background:var(--ink)}
.tap{position:absolute;top:0;bottom:0;z-index:1;cursor:pointer}
.tap.prev{left:0;width:35%}.tap.next{right:0;width:65%}
.ctrl{display:flex;align-items:center;gap:10px;width:min(100%,420px);justify-content:space-between}
.ctrl button,.ctrl a{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px var(--font);
  padding:9px 16px;border-radius:999px;cursor:pointer;text-decoration:none;min-width:44px;text-align:center}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl button:not(:disabled):hover,.ctrl a:hover{background:#1d2226}
.count{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);min-width:44px;text-align:center}
.mid{display:flex;align-items:center;gap:10px}
.ctrl button,.ctrl a{white-space:nowrap}
@media (max-width:420px){.ctrl button,.ctrl a{padding:9px 12px;font-size:14px}.mid{gap:6px}}
</style></head>
<body>
<div class="stage" id="stage" aria-roledescription="carrossel" aria-label="Stories Eleições 2026">
  <div class="bars" id="bars"></div>
  <div class="tap prev" id="tapPrev" aria-hidden="true"></div>
  <div class="tap next" id="tapNext" aria-hidden="true"></div>
</div>
<nav class="ctrl" aria-label="Navegação">
  <button id="prev" aria-label="Anterior">← Anterior</button>
  <div class="mid"><span class="count" id="count" aria-live="polite"></span><a id="dl" download aria-label="Baixar imagem atual">Baixar</a></div>
  <button id="next" aria-label="Próximo">Próximo →</button>
</nav>
<script>
(function(){
  const N=6, stage=document.getElementById('stage'), bars=document.getElementById('bars');
  const alts=['O placar mudou de lado','Os dois cresceram','De onde vieram os votos a mais','A mudança aconteceu no país inteiro','O que o modelo de migração consegue estimar','O que os dados não dizem'];
  const imgs=[];
  for(let i=1;i<=N;i++){
    const im=new Image(); im.src='story_'+i+'.png'; im.alt=alts[i-1]; im.draggable=false;
    stage.insertBefore(im,bars); imgs.push(im);
    bars.appendChild(document.createElement('span'));
  }
  let cur=0;
  function show(i){
    cur=Math.max(0,Math.min(N-1,i));
    imgs.forEach((im,k)=>im.classList.toggle('on',k===cur));
    [...bars.children].forEach((b,k)=>b.classList.toggle('done',k<=cur));
    document.getElementById('count').textContent=(cur+1)+' / '+N;
    document.getElementById('prev').disabled=cur===0;
    document.getElementById('next').disabled=cur===N-1;
    const dl=document.getElementById('dl'); dl.href=imgs[cur].src; dl.setAttribute('download','story_'+(cur+1)+'.png');
    if(location.hash!=='#'+(cur+1)) history.replaceState(null,'','#'+(cur+1));
  }
  const go=d=>show(cur+d);
  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('next').onclick=()=>go(1);
  document.getElementById('tapPrev').onclick=()=>go(-1);
  document.getElementById('tapNext').onclick=()=>go(1);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}
    else if(e.key==='ArrowLeft'){go(-1)}
    else if(e.key==='Home'){show(0)} else if(e.key==='End'){show(N-1)}
  });
  let x0=null;
  stage.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  stage.addEventListener('touchend',e=>{
    if(x0===null)return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>40){e.preventDefault();go(dx<0?1:-1)}
  });
  const h=parseInt(location.hash.slice(1),10);
  show(Number.isFinite(h)?h-1:0);
  addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(Number.isFinite(n)&&n-1!==cur)show(n-1)});
})();
</script>
</body></html>
